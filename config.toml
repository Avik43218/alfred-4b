# A.L.F.R.E.D. Configuration
# System & Hardware Resource Allocation

[system]
name = "A.L.F.R.E.D."
version = "1.0.0"
boss_title = "Sir"

[hardware]
# 4GB VRAM HYBRID ALLOCATION:
# Ollama offloads 18 layers (~1.4GB VRAM) to GPU for fast generation.
# Coqui XTTS runs on GPU (~1.8GB VRAM) for high-quality voice synthesis.
# Whisper STT runs on CPU (0MB VRAM, ultra-low latency) to preserve headroom.
llm_device = "hybrid"
stt_device = "cpu"
tts_device = "cuda"
vram_limit_mb = 4096
enforce_cpu_llm = false

[ollama]
host = "http://127.0.0.1:11434"
model = "alfred"
fallback_model = "qwen2.5:3b"
# Offload 18 layers to GPU VRAM for accelerated token generation
num_gpu = 18
num_threads = 8
temperature = 0.6
num_ctx = 2048

[voice]
# Python Voice Microservice (Whisper STT + Coqui XTTS on CUDA)
service_url = "http://127.0.0.1:8765"
whisper_model = "base.en"
whisper_compute_type = "float16"
xtts_model = "tts_models/multilingual/multi-dataset/xtts_v2"
language = "en"
auto_play_tts = true
record_duration_sec = 6
speaker_wav = "assets/voices/alfred.wav"

[tools]
web_search_enabled = true
command_exec_enabled = true
require_confirmation = true
command_timeout_sec = 10

# Safe commands that can run without interactive confirmation
whitelist = [
    "ls", "dir", "pwd", "date", "uptime", "whoami",
    "cat", "head", "tail", "grep", "find", "uname",
    "free", "df", "ps", "git status", "git log -n 5",
    "echo", "which", "brew-tea"
]

# Prohibited destructive commands
blacklist = [
    "rm -rf /", "rm -rf ~", "mkfs", "dd", "shutdown",
    "reboot", "sudo", "chmod -R 777 /", ":(){ :|:& };:"
]
