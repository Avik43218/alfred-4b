[package]
name = "alfred"
version = "1.0.0"
edition = "2021"
authors = ["A.L.F.R.E.D. Team"]
description = "A.L.F.R.E.D. - Butler AI Assistant with Ollama CPU inference, Whisper GPU STT, Coqui XTTS GPU TTS, and Ratatui TUI"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
chrono = "0.4"
regex = "1.10"
futures = "0.3"
urlencoding = "2.1"
